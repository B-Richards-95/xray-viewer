<meta charset="utf-8">
<title>X-ray viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="X-ray viewer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png">
<style>
  :root {
    --bg: #0b0d10;
    --panel: #14181d;
    --panel-2: #1c2128;
    --line: #2b323b;
    --ink: #e6e9ed;
    --ink-dim: #97a1ad;
    --accent: #ffcc00;
    --danger: #ff6b5e;
    --tap: 44px;
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overscroll-behavior: none;
  }
  body { display: flex; flex-direction: column; padding: var(--safe-t) var(--safe-r) var(--safe-b) var(--safe-l); }

  header {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0 6px 0 0; letter-spacing: .01em; }

  button, .btn {
    min-height: var(--tap); min-width: var(--tap);
    padding: 0 14px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--panel-2); color: var(--ink); font: inherit; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  select {
    min-height: var(--tap); padding: 0 10px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--panel-2); color: var(--ink); font: inherit;
  }
  button:active { background: #262d36; }
  button[aria-pressed="true"] { background: var(--accent); color: #14181d; border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .4; }

  #views { display: flex; gap: 6px; overflow-x: auto; padding: 6px 12px; border-bottom: 1px solid var(--line); }
  #views button { white-space: nowrap; }

  #tabs { display: flex; gap: 6px; margin-left: auto; }
  #panels { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  .panel { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  #reliefStage { position: relative; flex: 1 1 auto; min-height: 0; background: #000; overflow: hidden; }
  #reliefCanvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
  #reliefMessage {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 24px; color: var(--ink-dim); font-size: 14px; pointer-events: none;
  }
  #reliefNote { flex: 1 1 100%; color: var(--ink-dim); font-size: 12px; }

  #install {
    display: none; align-items: center; gap: 10px;
    padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--panel-2); font-size: 13px;
  }
  #install.show { display: flex; }
  #install p { margin: 0; flex: 1 1 auto; color: var(--ink-dim); }
  #install strong { color: var(--ink); }

  #stage { position: relative; flex: 1 1 auto; min-height: 0; background: #000; overflow: hidden; }
  #canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
  #empty {
    position: absolute; inset: 0; display: flex; flex-direction: column; gap: 14px;
    align-items: center; justify-content: center; text-align: center; padding: 24px; color: var(--ink-dim);
  }
  #err {
    position: absolute; left: 12px; right: 12px; top: 12px; padding: 10px 12px;
    background: #3a1d1b; border: 1px solid var(--danger); border-radius: 10px;
    color: #ffd9d5; font-size: 13px; white-space: pre-wrap; display: none;
  }

  #controls {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
    padding: 10px 12px; border-top: 1px solid var(--line); background: var(--panel);
  }
  .slider { display: flex; align-items: center; gap: 8px; flex: 1 1 200px; min-width: 180px; }
  .slider label { color: var(--ink-dim); font-size: 13px; white-space: nowrap; }
  input[type=range] { flex: 1 1 auto; min-width: 90px; height: var(--tap); accent-color: var(--accent); }
  .group { display: flex; gap: 6px; align-items: center; }
  #status { flex: 1 1 100%; color: var(--ink-dim); font-size: 13px; font-variant-numeric: tabular-nums; }
  .hide { display: none !important; }

  /* One row of tools: never wraps, scrolls sideways when the screen is too narrow. */
  #tools { display: flex; gap: 6px; flex: 1 1 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  #tools button { flex: 0 0 auto; padding: 0 12px; white-space: nowrap; }

  /* Markup row: hidden until Markup is on, then a second scrolling row of tools. */
  #markupTools { display: flex; gap: 6px; flex: 1 1 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  #markupTools button { flex: 0 0 auto; padding: 0 12px; white-space: nowrap; }
  #swatches, #widths { display: flex; gap: 6px; flex: 0 0 auto; }
  .swatch { padding: 0; width: var(--tap); border-radius: 12px; border: 2px solid var(--line); }
  .swatch[aria-pressed="true"] { border-color: var(--ink); border-width: 3px; }

  #markPop, #calibPop {
    position: absolute; z-index: 5; display: none; flex-direction: column; gap: 6px;
    padding: 8px; min-width: 160px;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 6px 24px rgba(0, 0, 0, .55);
  }
  #markPop.show, #calibPop.show { display: flex; }
  #markPop .row, #calibPop .row { display: flex; gap: 6px; }
  #markPop input, #calibPop input {
    min-height: var(--tap); flex: 1 1 auto; min-width: 0; padding: 0 8px;
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--panel); color: var(--ink); font: inherit;
  }
  #calibPop .hint { color: var(--ink-dim); font-size: 12px; max-width: 220px; }
</style>

<header>
  <h1>X-ray viewer</h1>
  <button id="open">Open files</button>
  <button id="clear">Clear</button>
  <input id="file" type="file" multiple accept=".dcm,.dicom,.ima,application/dicom" hidden>
  <div id="tabs">
    <button id="tab2d" aria-pressed="true">2D</button>
    <button id="tabRelief" aria-pressed="false">Relief</button>
  </div>
</header>

<div id="install">
  <p>Install it: tap <strong>Share</strong>, then <strong>Add to Home Screen</strong>. It then opens full screen and works offline.</p>
  <button id="installDismiss">Got it</button>
</div>

<div id="views"></div>

<div id="panels">
<div class="panel" id="panel2d">
<div id="stage">
  <canvas id="canvas"></canvas>
  <div id="empty">
    <div>No X-rays loaded.</div>
    <div style="font-size:13px">Tap <strong>Open files</strong> and pick your <code>.dcm</code> files.</div>
  </div>
  <div id="err"></div>
  <div id="markPop"></div>
  <div id="calibPop">
    <div class="hint">Type the real length of the line you just drew.</div>
    <div class="row">
      <input id="calibValue" type="number" step="0.1" min="0" inputmode="decimal" placeholder="Real length">
      <select id="calibUnit">
        <option value="mm">mm</option>
        <option value="cm">cm</option>
        <option value="in">in</option>
      </select>
    </div>
    <div class="row">
      <button id="calibApply">Apply</button>
      <button id="calibCancel">Cancel</button>
    </div>
  </div>
</div>

<div id="controls">
  <div class="slider"><label for="brightness">Brightness</label><input id="brightness" type="range" min="0" max="1" value="0"></div>
  <div class="slider"><label for="contrast">Contrast</label><input id="contrast" type="range" min="0" max="1" value="0"></div>
  <div class="group">
    <button id="invert" aria-pressed="false">Invert</button>
    <input id="strength" type="range" min="0" max="100" value="100" style="max-width:110px" disabled>
    <span id="strengthValue" style="color:var(--ink-dim);font-size:13px;min-width:38px">100%</span>
  </div>
  <div id="tools">
    <button id="toolLine" aria-pressed="false">Line</button>
    <button id="toolAngle" aria-pressed="false">Angle</button>
    <button id="toolCobb" aria-pressed="false">Cobb</button>
    <button id="toolCircle" aria-pressed="false">Circle</button>
    <button id="toolEllipse" aria-pressed="false">Ellipse</button>
    <button id="toolPoint" aria-pressed="false">Point</button>
    <button id="toolText" aria-pressed="false">Text</button>
    <button id="toolCalibrate" aria-pressed="false">Calibrate</button>
    <button id="clearCalib" disabled>Clear calibration</button>
    <button id="markup" aria-pressed="false">Markup</button>
    <button id="savePng">Save PNG</button>
    <button id="undo" disabled>Undo</button>
    <button id="redo" disabled>Redo</button>
    <button id="undoPoint">Undo point</button>
    <button id="clearMeasure">Clear</button>
  </div>
  <div id="markupTools" class="hide">
    <button id="mkInk" aria-pressed="false">Pen</button>
    <button id="mkHilite" aria-pressed="false">Highlighter</button>
    <button id="mkArrow" aria-pressed="false">Arrow</button>
    <button id="mkRect" aria-pressed="false">Rect</button>
    <button id="mkEllipse" aria-pressed="false">Circle</button>
    <button id="mkNote" aria-pressed="false">Text</button>
    <button id="mkEraser" aria-pressed="false">Eraser</button>
    <span id="swatches"></span>
    <span id="widths"></span>
  </div>
  <div class="group">
    <button id="resetWindow">Reset window</button>
    <button id="lock" aria-pressed="false">Lock</button>
    <button id="fit">Fit</button>
    <button id="rotateLeft">Rotate L</button>
    <button id="rotateRight">Rotate R</button>
  </div>
  <div id="status"></div>
</div>
</div>

<div class="panel hide" id="panelRelief">
  <div id="reliefStage">
    <canvas id="reliefCanvas"></canvas>
    <div id="reliefMessage">Open an X-ray, then tap Build.</div>
  </div>
  <div id="controls">
    <div class="group">
      <button id="reliefBuild">Build</button>
      <button id="reliefHome">Home</button>
      <button id="reliefInvert" aria-pressed="false">Invert</button>
    </div>
    <div class="group">
      <span style="color:var(--ink-dim);font-size:13px">Detail</span>
      <select id="reliefResolution"></select>
      <span style="color:var(--ink-dim);font-size:13px">Smooth</span>
      <select id="reliefSmooth"></select>
      <span style="color:var(--ink-dim);font-size:13px">Strength</span>
      <select id="reliefInvertStrength"></select>
    </div>
    <div id="reliefNote"></div>
  </div>
</div>
</div>

<script src="viewer-core.js"></script>
<script>
(function () {
  "use strict";
  var XV = globalThis.XV;

  var INVERT_STRENGTH_DEFAULT = 100;
  var TAP_SLOP_PX = 10;      // a drag longer than this is a pan, not a point
  var TAP_MAX_MS = 600;
  var TOOL_BUTTONS = {       // tool name -> its toolbar button id
    line: "toolLine", angle: "toolAngle", cobb: "toolCobb", circle: "toolCircle",
    ellipse: "toolEllipse", point: "toolPoint", text: "toolText", calibrate: "toolCalibrate",
  };
  var MARKUP_BUTTONS = {     // the second row, revealed by the Markup toggle
    ink: "mkInk", hilite: "mkHilite", arrow: "mkArrow", rect: "mkRect",
    ellipseShape: "mkEllipse", note: "mkNote", eraser: "mkEraser",
  };
  var MARKUP_COLOURS = ["#ff3b30", "#ff9500", "#ffcc00", "#34c759", "#007aff", "#ffffff"];
  var MARKUP_WIDTHS = [3, 8, 20];      // image px, so ink keeps its size on the film through zoom
  var INK_TOLERANCE = 1.5;             // image px, Ramer-Douglas-Peucker
  var HILITE_ALPHA = 0.35, HILITE_WIDEN = 3;
  var ERASE_RADIUS = 22;               // css px around the touch that counts as "on the stroke"
  var SAVE_DEBOUNCE_MS = 500;
  var HIT_RADIUS_TOUCH = 36, HIT_RADIUS_MOUSE = 8;   // css px, Datum's grab tolerance
  var LOUPE_RADIUS = 60, LOUPE_LIFT = 80, LOUPE_ZOOM = 2;  // css px
  var UNDO_CAP = 50;
  var MARK_COLOUR = "#ffcc00", REFERENCE_COLOUR = "#7fd6ff";

  var el = function (id) { return document.getElementById(id); };
  var stage = el("stage"), canvas = el("canvas"), ctx = canvas.getContext("2d");
  var errBox = el("err"), emptyBox = el("empty"), statusBox = el("status"), viewsBox = el("views");

  var films = [];            // parsed radiographs
  var current = -1;
  var levels = [];           // per-film [lo, hi], survives switching films
  var tool = null;           // null = view mode; otherwise a key of TOOL_BUTTONS
  var pending = [];          // image-px points of the mark being placed
  var hover = null;          // live point under the pen/mouse, for the rubber band
  var penAnchor = null;      // where a pen stroke touched down, first point of a 2-point drag
  var marks = [];            // per film index: [{id, type, pts, meta}], all in image px
  var undoStack = [], redoStack = [];   // snapshots of marks[current], newest last
  var loupe = null;          // {x, y} in canvas px while a finger drags a handle
  var popMark = -1;          // index of the mark whose popover is open
  var markupOn = false;      // is the markup row showing
  var inkColour = MARKUP_COLOURS[0], inkWidth = MARKUP_WIDTHS[1];
  var liveStroke = null;     // image-px points of the freehand stroke under the pen right now
  var calibLine = null;      // the two image-px points waiting for a typed real length
  var invertOn = false, invertStrength = INVERT_STRENGTH_DEFAULT;
  var xform = { scale: 1, tx: 0, ty: 0, rot: 0 };   // rot in radians, clockwise on screen
  var locked = false;        // padlock: no pan, zoom, twist — taps still place points
  var greyCanvas = document.createElement("canvas");
  var greyCtx = greyCanvas.getContext("2d");
  var greyDirty = true;
  var frameQueued = false;

  // ------------------------------------------------------------ IndexedDB
  // Raw file blobs only: parsing is cheap enough to redo on launch, and storing the
  // bytes means a re-parse always agrees with a fresh Open of the same file.
  // The second store, filmMeta, is keyed by the same file name as the blob store and holds
  // everything the viewer adds to a film: its manual calibration and its marks.
  var DB_NAME = "xray-ipad", DB_STORE = "files", DB_META = "filmMeta", DB_VERSION = 2;

  function openDb() {
    return new Promise(function (resolve, reject) {
      var req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = function () {
        if (!req.result.objectStoreNames.contains(DB_STORE)) req.result.createObjectStore(DB_STORE);
        if (!req.result.objectStoreNames.contains(DB_META)) req.result.createObjectStore(DB_META);
      };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
  }

  function dbTx(storeName, mode, run) {
    return openDb().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(storeName, mode);
        var out = run(tx.objectStore(storeName));
        tx.oncomplete = function () { resolve(out && out.result !== undefined ? out.result : out); };
        tx.onerror = function () { reject(tx.error); };
      });
    });
  }

  function storeFiles(fileList) {
    return dbTx(DB_STORE, "readwrite", function (store) {
      for (var i = 0; i < fileList.length; i++) store.put(fileList[i], fileList[i].name);
    });
  }

  function loadStoredFiles() {
    return dbTx(DB_STORE, "readonly", function (store) { return store.getAll(); }).catch(function () { return []; });
  }

  function saveFilmMeta(record) {
    return dbTx(DB_META, "readwrite", function (store) { store.put(record, record.name); });
  }

  function loadFilmMeta() {
    return dbTx(DB_META, "readonly", function (store) { return store.getAll(); }).catch(function () { return []; });
  }

  function clearStore() {
    return Promise.all([
      dbTx(DB_STORE, "readwrite", function (store) { store.clear(); }),
      dbTx(DB_META, "readwrite", function (store) { store.clear(); }),
    ]);
  }

  // 4.3: marks and calibration are written 500 ms after the last edit, so a long drag is one
  // write rather than one per frame. Switching films flushes first, or the film that just lost
  // focus would lose the edit still sitting in the timer.
  var saveTimer = null, savePending = null;

  function flushSave() {
    clearTimeout(saveTimer);
    saveTimer = null;
    if (!savePending) return;
    var record = savePending;
    savePending = null;
    saveFilmMeta(record).catch(function () { /* full or private: the marks stay in memory */ });
  }

  function scheduleSave() {
    var f = film();
    if (!f) return;
    savePending = {
      name: f.name,
      marks: cloneMarks(marks[current]),
      calibration: f.dicomSpacing ? { spacingMm: f.spacingMm.slice(), source: f.spacingSource } : null,
    };
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flushSave, SAVE_DEBOUNCE_MS);
  }

  /** Put stored calibration and marks back on freshly parsed films, matched by file name. */
  function applyFilmMeta(records) {
    var byName = {};
    (records || []).forEach(function (rec) { if (rec && rec.name) byName[rec.name] = rec; });
    films.forEach(function (f, i) {
      var rec = byName[f.name];
      if (!rec) return;
      if (rec.marks && rec.marks.length) marks[i] = cloneMarks(rec.marks);
      if (rec.calibration && rec.calibration.spacingMm) {
        f.dicomSpacing = { spacingMm: f.spacingMm, spacingSource: f.spacingSource, spacingIsValid: f.spacingIsValid };
        f.spacingMm = rec.calibration.spacingMm.slice();
        f.spacingSource = rec.calibration.source || "manual";
        f.spacingIsValid = true;
      }
    });
  }

  // Asked once; Safari decides. Without it a home-screen app's files can be evicted.
  function requestPersistence() {
    try {
      if (localStorage.getItem("xv-persist-asked")) return;
      localStorage.setItem("xv-persist-asked", "1");
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
    } catch (e) { /* private browsing: storage APIs throw, nothing here is essential */ }
  }

  // --------------------------------------------------------------- loading
  function showError(text) {
    errBox.textContent = text;
    errBox.style.display = text ? "block" : "none";
  }

  function ingest(fileObjects) {
    var problems = [];
    var jobs = Array.prototype.map.call(fileObjects, function (f) {
      return f.arrayBuffer().then(function (buf) {
        try { return XV.parseDicom(buf, f.name); }
        catch (e) { problems.push(f.name + ": " + e.message); return null; }
      });
    });
    return Promise.all(jobs).then(function (parsed) {
      var loaded = parsed.filter(Boolean);
      loaded.sort(function (a, b) { return a.name.localeCompare(b.name); });
      films = XV.applyGenericLabels(loaded);
      levels = films.map(function (f) { return f.windowRange.slice(); });
      marks = films.map(function () { return []; });
      return loadFilmMeta().then(function (records) {
        applyFilmMeta(records);
        showError(problems.length ? problems.join("\n") : "");
        renderViews();
        if (films.length) select(0); else { current = -1; emptyBox.classList.remove("hide"); draw(); }
        return films.length;
      });
    });
  }

  function renderViews() {
    viewsBox.innerHTML = "";
    films.forEach(function (f, i) {
      var b = document.createElement("button");
      b.textContent = f.label || f.name;
      b.setAttribute("aria-pressed", String(i === current));
      b.onclick = function () { select(i); };
      viewsBox.appendChild(b);
    });
  }

  function select(index) {
    if (index < 0 || index >= films.length) return;
    flushSave();
    current = index;
    cancelMeasurement();
    // The stack holds snapshots of one film's marks, so switching films starts a fresh one.
    undoStack = []; redoStack = [];
    syncUndoButtons();
    emptyBox.classList.add("hide");
    syncSliders();
    greyDirty = true;
    fitToStage();
    Array.prototype.forEach.call(viewsBox.children, function (b, i) {
      b.setAttribute("aria-pressed", String(i === current));
    });
    syncCalibButtons();
    updateStatus();
    if (window.XVApp && window.XVApp.onFilmChange) window.XVApp.onFilmChange();
  }

  function film() { return films[current]; }

  /** Is an image-px point on the film? */
  function insideFilm(ip) {
    var f = film();
    return !!f && ip[0] >= 0 && ip[1] >= 0 && ip[0] <= f.cols && ip[1] <= f.rows;
  }

  // ------------------------------------------------------------- windowing
  function syncSliders() {
    var f = film();
    if (!f) return;
    var bounds = XV.windowBounds(f.pixels);
    var w = XV.windowFromLevels(levels[current]);
    var brightness = el("brightness"), contrast = el("contrast");
    brightness.min = bounds.levelMin; brightness.max = bounds.levelMax;
    brightness.value = String(Math.round(Math.min(Math.max(w.center, bounds.levelMin), bounds.levelMax)));
    contrast.min = bounds.widthMin; contrast.max = bounds.widthMax;
    // Qt's setInvertedAppearance(True): right = narrower window = more contrast.
    var width = Math.round(Math.min(Math.max(w.width, bounds.widthMin), bounds.widthMax));
    contrast.value = String(bounds.widthMin + bounds.widthMax - width);
  }

  function widthFromSlider() {
    var contrast = el("contrast");
    return Number(contrast.min) + Number(contrast.max) - Number(contrast.value);
  }

  function onWindowSlider() {
    if (!film()) return;
    levels[current] = XV.levelsFromWindow(Number(el("brightness").value), widthFromSlider());
    greyDirty = true;
    requestDraw();
    updateStatus();
  }

  function resetWindow() {
    if (!film()) return;
    levels[current] = film().windowRange.slice();
    syncSliders();
    greyDirty = true;
    requestDraw();
    updateStatus();
  }

  // --------------------------------------------------------------- drawing
  function rebuildGrey() {
    var f = film();
    if (!f) return;
    greyCanvas.width = f.cols;
    greyCanvas.height = f.rows;
    var lo = levels[current][0], hi = levels[current][1];
    var span = hi - lo;
    if (span <= 0) span = 1;
    var lut = XV.blendLut(invertOn ? invertStrength / 100 : 0);

    // One table over the whole 16-bit range, then a straight lookup per pixel: the
    // per-pixel work stays a single array read even on a 5-megapixel film.
    var table = new Uint8Array(65536);
    for (var v = 0; v < 65536; v++) {
      var t = ((v - lo) / span) * 255;
      table[v] = lut[t < 0 ? 0 : t > 255 ? 255 : Math.round(t)];
    }
    var image = greyCtx.createImageData(f.cols, f.rows);
    var out = image.data;
    var px = f.pixels;
    for (var i = 0, j = 0; i < px.length; i++, j += 4) {
      var g = table[px[i]];
      out[j] = g; out[j + 1] = g; out[j + 2] = g; out[j + 3] = 255;
    }
    greyCtx.putImageData(image, 0, 0);
    greyDirty = false;
  }

  function fitToStage() {
    var f = film();
    if (!f) return;
    var w = canvas.width, h = canvas.height;
    // Fit the box the film fills *after* rotation, so a rotated film still fills the stage.
    var ext = XV.rotatedExtent(f.cols, f.rows, xform.rot);
    var scale = Math.min(w / ext.width, h / ext.height);
    xform.scale = scale;
    var t = XV.translationFixing([f.cols / 2, f.rows / 2], [w / 2, h / 2], scale, xform.rot);
    xform.tx = t[0];
    xform.ty = t[1];
    requestDraw();
  }

  /** Turn by a quarter, keeping whatever is under the middle of the stage under it. */
  function rotateBy(radians) {
    if (!film()) return;
    var centre = { x: canvas.width / 2, y: canvas.height / 2 };
    var anchor = imagePoint(centre);
    xform.rot += radians;
    var t = XV.translationFixing(anchor, [centre.x, centre.y], xform.scale, xform.rot);
    xform.tx = t[0];
    xform.ty = t[1];
    requestDraw();
  }

  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var r = stage.getBoundingClientRect();
    var w = Math.max(1, Math.round(r.width * dpr));
    var h = Math.max(1, Math.round(r.height * dpr));
    if (canvas.width === w && canvas.height === h) return;
    var hadFilm = !!film();
    canvas.width = w; canvas.height = h;
    if (hadFilm) fitToStage(); else requestDraw();
  }

  function requestDraw() {
    if (frameQueued) return;
    frameQueued = true;
    requestAnimationFrame(function () { frameQueued = false; draw(); });
  }

  function draw() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    var f = film();
    if (!f) return;
    if (greyDirty) rebuildGrey();
    ctx.imageSmoothingEnabled = xform.scale < 1;
    var cos = Math.cos(xform.rot), sin = Math.sin(xform.rot), s = xform.scale;
    ctx.setTransform(s * cos, s * sin, -s * sin, s * cos, xform.tx, xform.ty);
    ctx.drawImage(greyCanvas, 0, 0);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    drawMarks(ctx, xform, dprNow());
    drawLoupe();
  }

  function dprNow() { return Math.min(window.devicePixelRatio || 1, 2); }

  function toScreen(p, xf) {
    return XV.imageToScreen(p, xf || xform);
  }

  function spacingNow() {
    var f = film();
    return f && f.spacingIsValid ? f.spacingMm : [1.0, 1.0];
  }

  function isCalibrated() {
    var f = film();
    return !!(f && f.spacingIsValid);
  }

  /** The line marked as the reference, if one is set: every other line labels its Δ from it. */
  function referenceMark() {
    var found = (marks[current] || []).filter(function (m) { return m.meta && m.meta.reference; });
    return found.length ? found[0] : null;
  }

  function labelOf(mark) {
    return XV.describeMark(mark, spacingNow(), isCalibrated(), { reference: referenceMark() });
  }

  /* One mark, on whatever context and transform it is asked for (the loupe passes its own,
   * the PNG export passes an identity one at native film resolution). Shapes are built in
   * screen space so rotation and zoom come along for free.
   */
  function drawMark(c, mark, xf, dpr, live) {
    var pts = mark.pts || [];
    if (!pts.length) return;
    var colour = mark.meta && mark.meta.reference ? REFERENCE_COLOUR : MARK_COLOUR;
    c.save();
    c.strokeStyle = colour;
    c.fillStyle = colour;
    c.lineWidth = 2 * dpr;
    c.setLineDash(live ? [6 * dpr, 5 * dpr] : []);
    var s = pts.map(function (p) { return toScreen(p, xf); });
    c.beginPath();
    if (mark.type === "circle" && s.length >= 2) {
      c.arc(s[0][0], s[0][1], Math.hypot(s[1][0] - s[0][0], s[1][1] - s[0][1]), 0, Math.PI * 2);
    } else if (mark.type === "ellipse" && s.length >= 2) {
      var mid = toScreen([(pts[0][0] + pts[1][0]) / 2, (pts[0][1] + pts[1][1]) / 2], xf);
      var scale = (xf || xform).scale;
      c.ellipse(
        mid[0], mid[1],
        Math.abs(pts[1][0] - pts[0][0]) * scale / 2, Math.abs(pts[1][1] - pts[0][1]) * scale / 2,
        (xf || xform).rot, 0, Math.PI * 2
      );
    } else if (mark.type === "cobb") {
      c.moveTo(s[0][0], s[0][1]);
      if (s.length >= 2) c.lineTo(s[1][0], s[1][1]);
      if (s.length >= 3) { c.moveTo(s[2][0], s[2][1]); if (s.length >= 4) c.lineTo(s[3][0], s[3][1]); }
    } else {
      s.forEach(function (p, i) { if (i === 0) c.moveTo(p[0], p[1]); else c.lineTo(p[0], p[1]); });
    }
    c.stroke();
    c.setLineDash([]);
    s.forEach(function (p) {
      c.beginPath();
      c.arc(p[0], p[1], 4 * dpr, 0, Math.PI * 2);
      c.fill();
    });
    var text = labelOf(mark);
    if (text) {
      var last = s[s.length - 1];
      c.font = (13 * dpr) + "px -apple-system, system-ui, sans-serif";
      c.textBaseline = "bottom";
      // XV.LABEL_OFFSET so the label lands exactly where XV.hitTest looks for it.
      c.fillText(text, last[0] + XV.LABEL_OFFSET[0], last[1] + XV.LABEL_OFFSET[1]);
    }
    c.restore();
  }

  /* The outline a markup shape is erased by: rect and circle are stored as two opposite
   * corners, so the eraser walks their bounding ring.
   * ponytail: a circle is erased by its bounding box, not its curve — a tap just inside a
   * corner still erases it. Upgrade path: an ellipse-specific distance in viewer-core.
   */
  function markPolyline(m) {
    var pts = m.pts || [];
    if ((m.type === "rect" || m.type === "ellipseShape") && pts.length >= 2) {
      var a = pts[0], b = pts[1];
      return [[a[0], a[1]], [b[0], a[1]], [b[0], b[1]], [a[0], b[1]], [a[0], a[1]]];
    }
    return pts;
  }

  function drawArrowHead(c, from, to, width) {
    var a = Math.atan2(to[1] - from[1], to[0] - from[0]);
    var len = Math.max(8, width * 3);
    c.beginPath();
    c.moveTo(to[0], to[1]);
    c.lineTo(to[0] - len * Math.cos(a - 0.4), to[1] - len * Math.sin(a - 0.4));
    c.lineTo(to[0] - len * Math.cos(a + 0.4), to[1] - len * Math.sin(a + 0.4));
    c.closePath();
    c.fill();
  }

  /** A markup stroke: its own colour, its width measured on the film so zoom scales it. */
  function drawMarkupMark(c, mark, xf, dpr) {
    var pts = mark.pts || [];
    if (!pts.length) return;
    var meta = mark.meta || {};
    var scale = (xf || xform).scale;
    var width = Math.max(1, (meta.width || MARKUP_WIDTHS[1]) * scale);
    var s = pts.map(function (p) { return toScreen(p, xf); });
    c.save();
    c.strokeStyle = meta.color || MARKUP_COLOURS[0];
    c.fillStyle = c.strokeStyle;
    c.lineJoin = "round";
    c.lineCap = "round";
    c.lineWidth = width;
    if (mark.type === "hilite") { c.globalAlpha = HILITE_ALPHA; c.lineWidth = width * HILITE_WIDEN; }
    if (mark.type === "note") {
      c.font = "600 " + (16 * dpr) + "px -apple-system, system-ui, sans-serif";
      c.textBaseline = "bottom";
      c.fillText(meta.text || "", s[0][0], s[0][1]);
      c.restore();
      return;
    }
    c.beginPath();
    if (mark.type === "ellipseShape" && s.length >= 2) {
      var mid = toScreen([(pts[0][0] + pts[1][0]) / 2, (pts[0][1] + pts[1][1]) / 2], xf);
      c.ellipse(
        mid[0], mid[1],
        Math.abs(pts[1][0] - pts[0][0]) * scale / 2, Math.abs(pts[1][1] - pts[0][1]) * scale / 2,
        (xf || xform).rot, 0, Math.PI * 2
      );
    } else if (mark.type === "rect" && s.length >= 2) {
      markPolyline(mark).map(function (p) { return toScreen(p, xf); })
        .forEach(function (p, i) { if (i === 0) c.moveTo(p[0], p[1]); else c.lineTo(p[0], p[1]); });
    } else {
      s.forEach(function (p, i) { if (i === 0) c.moveTo(p[0], p[1]); else c.lineTo(p[0], p[1]); });
    }
    c.stroke();
    if (mark.type === "arrow" && s.length >= 2) drawArrowHead(c, s[0], s[1], width);
    c.restore();
  }

  function drawMarks(c, xf, dpr) {
    if (current < 0) return;
    var list = marks[current] || [];
    // Markup first: measurements always stay readable on top of the ink.
    list.forEach(function (m) { if (XV.isMarkup(m)) drawMarkupMark(c, m, xf, dpr); });
    list.forEach(function (m) { if (!XV.isMarkup(m)) drawMark(c, m, xf, dpr, false); });
    if (liveStroke && liveStroke.length > 1) {
      drawMarkupMark(c, { type: tool, pts: liveStroke, meta: inkMeta() }, xf, dpr);
    }
    if (pending.length || penAnchor) {
      var preview = previewMark();
      if (XV.isMarkup(preview)) drawMarkupMark(c, preview, xf, dpr);
      else drawMark(c, preview, xf, dpr, true);
    }
  }

  function inkMeta() {
    return { color: inkColour, width: inkWidth };
  }

  /** The mark being placed, with the live point under the pen/mouse on the end of it. */
  function previewMark() {
    var pts = pending.slice();
    if (!pts.length && penAnchor) pts.push(penAnchor);
    if (hover && pts.length < (XV.POINTS_NEEDED[tool] || 0)) pts.push(hover);
    return { id: "preview", type: tool, pts: pts, meta: XV.isMarkup({ type: tool }) ? inkMeta() : {} };
  }

  /* 2× magnifier under a dragging finger: the same scene re-drawn through a doubled
   * transform, clipped to a circle lifted clear of the fingertip.
   */
  function drawLoupe() {
    if (!loupe || !film()) return;
    var dpr = dprNow();
    var r = LOUPE_RADIUS * dpr;
    var cx = loupe.x, cy = loupe.y - LOUPE_LIFT * dpr;
    var anchor = XV.screenToImage([loupe.x, loupe.y], xform);
    var scale = xform.scale * LOUPE_ZOOM;
    var t = XV.translationFixing(anchor, [cx, cy], scale, xform.rot);
    var xf = { scale: scale, tx: t[0], ty: t[1], rot: xform.rot };
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.clip();
    ctx.fillStyle = "#000";
    ctx.fillRect(cx - r, cy - r, 2 * r, 2 * r);
    var cos = Math.cos(xf.rot), sin = Math.sin(xf.rot);
    ctx.setTransform(scale * cos, scale * sin, -scale * sin, scale * cos, xf.tx, xf.ty);
    ctx.drawImage(greyCanvas, 0, 0);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    drawMarks(ctx, xf, dpr);
    ctx.restore();
    ctx.save();
    ctx.strokeStyle = MARK_COLOUR;
    ctx.lineWidth = 2 * dpr;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx - 10 * dpr, cy); ctx.lineTo(cx + 10 * dpr, cy);
    ctx.moveTo(cx, cy - 10 * dpr); ctx.lineTo(cx, cy + 10 * dpr);
    ctx.stroke();
    ctx.restore();
  }

  // ------------------------------------------------------------ measuring
  function toolMode() { return tool || XV.MODE_VIEW; }

  function markId() {
    return "m" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function cloneMarks(list) {
    return (list || []).map(function (m) {
      var meta = {};
      Object.keys(m.meta || {}).forEach(function (k) { meta[k] = m.meta[k]; });
      return { id: m.id, type: m.type, pts: m.pts.map(function (p) { return p.slice(); }), meta: meta };
    });
  }

  function pushUndo() {
    if (current < 0) return;
    undoStack.push(cloneMarks(marks[current]));
    if (undoStack.length > UNDO_CAP) undoStack.shift();
    redoStack = [];
    syncUndoButtons();
  }

  function syncUndoButtons() {
    el("undo").disabled = !undoStack.length;
    el("redo").disabled = !redoStack.length;
  }

  function afterEdit() {
    hidePopover();
    syncUndoButtons();
    scheduleSave();
    requestDraw();
    updateStatus();
  }

  function undo() {
    if (current < 0 || !undoStack.length) return;
    redoStack.push(cloneMarks(marks[current]));
    marks[current] = undoStack.pop();
    pending = [];
    afterEdit();
  }

  function redo() {
    if (current < 0 || !redoStack.length) return;
    undoStack.push(cloneMarks(marks[current]));
    marks[current] = redoStack.pop();
    pending = [];
    afterEdit();
  }

  function toolButtonId(name) {
    return TOOL_BUTTONS[name] || MARKUP_BUTTONS[name];
  }

  function allToolNames() {
    return Object.keys(TOOL_BUTTONS).concat(Object.keys(MARKUP_BUTTONS));
  }

  function isFreehand() {
    return tool === "ink" || tool === "hilite";
  }

  function toolHint() {
    if (!tool) return "";
    if (isFreehand()) return "draw with the pen or one finger";
    if (tool === "eraser") return "tap a markup stroke to erase it";
    if (tool === "calibrate") return "draw a line across something you know the size of";
    return "tap " + XV.POINTS_NEEDED[tool] + " point(s)";
  }

  function setTool(next) {
    tool = tool === next ? null : next;
    pending = [];
    hover = null;
    penAnchor = null;
    liveStroke = null;
    hidePopover();
    hideCalibForm();
    allToolNames().forEach(function (name) {
      el(toolButtonId(name)).setAttribute("aria-pressed", String(tool === name));
    });
    updateStatus(toolHint());
    requestDraw();
  }

  function cancelMeasurement() {
    tool = null;
    pending = [];
    hover = null;
    penAnchor = null;
    liveStroke = null;
    hidePopover();
    hideCalibForm();
    allToolNames().forEach(function (name) {
      el(toolButtonId(name)).setAttribute("aria-pressed", "false");
    });
  }

  function clearMeasurements() {
    if (current >= 0 && (marks[current] || []).length) pushUndo();
    if (current >= 0) marks[current] = [];
    pending = [];
    afterEdit();
  }

  /** Drop the point placed last; with nothing pending, drop the last whole mark. */
  function undoLastPoint() {
    if (pending.length) { pending.pop(); requestDraw(); updateStatus(); return; }
    if (current < 0 || !(marks[current] || []).length) return;
    pushUndo();
    marks[current].pop();
    afterEdit();
  }

  function addPoint(x, y) {
    var f = film();
    if (!f || !tool) return;
    var needed = XV.POINTS_NEEDED[tool] || 0;
    pending.push([x, y]);
    if (pending.length < needed) {
      updateStatus(pending.length + "/" + needed + " points");
      requestDraw();
      return;
    }
    var pts = pending.slice();
    pending = [];
    commitMark(pts);
  }

  function commitMark(pts) {
    if (tool === "calibrate") { showCalibForm(pts); return; }
    var meta = {};
    if (tool === "point") {
      meta.n = (marks[current] || []).filter(function (m) { return m.type === "point"; }).length + 1;
    }
    if (XV.isMarkup({ type: tool })) { meta.color = inkColour; meta.width = inkWidth; }
    if (tool === "note") {
      // ponytail: same window.prompt shortcut as the text measurement tool.
      var noteText = window.prompt("Note text", "");
      if (!noteText) { requestDraw(); return; }
      meta.text = noteText;
    }
    if (tool === "text") {
      // ponytail: window.prompt is the whole text editor (no deps, no keyboard plumbing);
      // upgrade path is an inline contenteditable label anchored to the mark.
      var typed = window.prompt("Label text", "");
      if (!typed) { requestDraw(); return; }
      meta.text = typed;
    }
    pushUndo();
    var mark = { id: markId(), type: tool, pts: pts, meta: meta };
    marks[current].push(mark);
    updateStatus(labelOf(mark));
    scheduleSave();
    requestDraw();
  }

  /** A freehand stroke, thinned to the points that carry its shape. */
  function commitStroke(raw) {
    var pts = XV.simplifyPolyline(raw, INK_TOLERANCE);
    if (current < 0 || pts.length < 2) return;
    pushUndo();
    marks[current].push({ id: markId(), type: tool, pts: pts, meta: inkMeta() });
    afterEdit();
  }

  /** Eraser: the topmost markup stroke the touch landed on goes, whole. */
  function eraseAt(ip) {
    var list = marks[current] || [];
    var radius = (ERASE_RADIUS * dprNow()) / (xform.scale || 1);
    for (var i = list.length - 1; i >= 0; i--) {
      if (!XV.isMarkup(list[i])) continue;
      var reach = radius + ((list[i].meta && list[i].meta.width) || 0) / 2;
      if (XV.polylineDistance(markPolyline(list[i]), ip) <= reach) {
        pushUndo();
        list.splice(i, 1);
        afterEdit();
        return;
      }
    }
  }

  // ----------------------------------------------------------- calibration
  // 3.1 (Weasis pattern): the drawn line plus a typed real length fix mm-per-pixel for this
  // film. Labels are computed at draw time, so marks placed before it relabel themselves.
  function showCalibForm(pts) {
    calibLine = pts;
    var pop = el("calibPop");
    el("calibValue").value = "";
    pop.classList.add("show");
    var box = stage.getBoundingClientRect();
    var w = pop.offsetWidth || 240, h = pop.offsetHeight || 150;
    pop.style.left = Math.max(4, (box.width - w) / 2) + "px";
    pop.style.top = Math.max(4, (box.height - h) / 2) + "px";
    el("calibValue").focus();
    requestDraw();
  }

  function hideCalibForm() {
    calibLine = null;
    el("calibPop").classList.remove("show");
  }

  function applyCalibration() {
    var f = film();
    var spacing = calibLine && f
      ? XV.spacingFromKnownLength(calibLine[0], calibLine[1], Number(el("calibValue").value), el("calibUnit").value)
      : null;
    if (!spacing) { showError("Type the real length of the line you drew (a number above zero)."); return; }
    showError("");
    if (!f.dicomSpacing) {
      f.dicomSpacing = { spacingMm: f.spacingMm, spacingSource: f.spacingSource, spacingIsValid: f.spacingIsValid };
    }
    f.spacingMm = spacing;
    f.spacingSource = "manual";
    f.spacingIsValid = true;
    hideCalibForm();
    cancelMeasurement();
    syncCalibButtons();
    afterEdit();
  }

  function clearCalibration() {
    var f = film();
    if (!f || !f.dicomSpacing) return;
    f.spacingMm = f.dicomSpacing.spacingMm;
    f.spacingSource = f.dicomSpacing.spacingSource;
    f.spacingIsValid = f.dicomSpacing.spacingIsValid;
    f.dicomSpacing = null;
    syncCalibButtons();
    afterEdit();
  }

  function syncCalibButtons() {
    el("clearCalib").disabled = !(film() && film().dicomSpacing);
  }

  // -------------------------------------------------------------- popover
  function hidePopover() {
    popMark = -1;
    el("markPop").classList.remove("show");
  }

  /** The one number the popover lets you type for this mark. */
  function exactValueOf(mark) {
    var sp = spacingNow();
    if (mark.type === "angle") return XV.angleDeg(mark.pts[0], mark.pts[1], mark.pts[2], sp);
    if (mark.type === "cobb") return XV.cobbAngle(mark.pts, sp);
    if (mark.type === "circle") return XV.circleMetrics(mark.pts, sp, isCalibrated()).diameter;
    return isCalibrated() ? XV.distanceMm(mark.pts[0], mark.pts[1], sp) : XV.distancePx(mark.pts[0], mark.pts[1]);
  }

  function applyExact(index, value) {
    var m = marks[current][index];
    if (!Number.isFinite(value)) return;
    pushUndo();
    m.pts = (m.type === "angle" || m.type === "cobb")
      ? XV.setMarkAngle(m, value, spacingNow())
      : XV.setMarkLength(m, value, spacingNow(), isCalibrated());
    updateStatus(labelOf(m));
    afterEdit();
  }

  function snapMarkAngle(index, step) {
    var m = marks[current][index];
    pushUndo();
    m.pts = XV.setMarkAngle(m, XV.snapAngle(exactValueOf(m), step), spacingNow());
    updateStatus(labelOf(m));
    afterEdit();
  }

  function showPopover(index, at) {
    var m = marks[current][index];
    if (!m) return;
    popMark = index;
    var pop = el("markPop");
    pop.innerHTML = "";
    var button = function (text, onclick) {
      var b = document.createElement("button");
      b.textContent = text;
      b.onclick = onclick;
      return b;
    };
    pop.appendChild(button("Delete", function () {
      pushUndo();
      marks[current].splice(index, 1);
      afterEdit();
    }));
    if (m.type === "angle" || m.type === "cobb") {
      var snapRow = document.createElement("div");
      snapRow.className = "row";
      [1, 5].forEach(function (step) {
        snapRow.appendChild(button("Snap " + step + "°", function () { snapMarkAngle(index, step); }));
      });
      pop.appendChild(snapRow);
    }
    if (["angle", "cobb", "line", "circle"].indexOf(m.type) >= 0) {
      var row = document.createElement("div");
      row.className = "row";
      var input = document.createElement("input");
      input.type = "number";
      input.step = "0.1";
      input.value = exactValueOf(m).toFixed(1);
      row.appendChild(input);
      row.appendChild(button("Set", function () { applyExact(index, Number(input.value)); }));
      pop.appendChild(row);
    }
    if (m.type === "line") {
      pop.appendChild(button(m.meta.tiltAxis === "v" ? "Tilt vs horizontal" : "Tilt vs vertical", function () {
        pushUndo();
        m.meta.tiltAxis = m.meta.tiltAxis === "v" ? "h" : "v";
        afterEdit();
      }));
    }
    pop.appendChild(button(m.meta.reference ? "Reference ✓" : "Set as reference", function () {
      pushUndo();
      marks[current].forEach(function (other) { if (other.meta) other.meta.reference = false; });
      m.meta.reference = true;
      afterEdit();
    }));
    pop.appendChild(button("Close", hidePopover));
    var dpr = dprNow();
    var box = stage.getBoundingClientRect();
    pop.classList.add("show");
    var w = pop.offsetWidth || 170, h = pop.offsetHeight || 180;
    pop.style.left = Math.max(4, Math.min(at.x / dpr - w / 2, box.width - w - 4)) + "px";
    pop.style.top = Math.max(4, Math.min(at.y / dpr + 16, box.height - h - 4)) + "px";
  }

  function updateStatus(message) {
    var f = film();
    if (!f) { statusBox.textContent = ""; return; }
    var lo = levels[current][0], hi = levels[current][1];
    var base = f.label + " — W " + Math.round(hi - lo) + " / L " + Math.round((lo + hi) / 2);
    base += "  " + f.cols + "×" + f.rows;
    if (f.spacingSource === "manual") base += " — calibrated (manual)";
    else if (!f.spacingIsValid) base += " — uncalibrated (px)";

  }

  // ------------------------------------------------------- touch / pointer
  var pointers = new Map();
  var gesture = null;

  function localPoint(ev) {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var r = canvas.getBoundingClientRect();
    return { x: (ev.clientX - r.left) * dpr, y: (ev.clientY - r.top) * dpr };
  }

    return XV.screenToImage([p.x, p.y], xform);
  }

      if (hit) rec.edit = { hit: hit, last: imagePoint(p), pushed: false };

    var pts = Array.from(pointers.values());

      dist: Math.hypot(b.x - a.x, b.y - a.y) || 1,
      angle: Math.atan2(b.y - a.y, b.x - a.x),
      anchor: imagePoint(mid),          // the bit of anatomy the pinch centre sits on
      scale: xform.scale, rot: xform.rot,

  function hitRadius(pointerType) {
    return (pointerType === "mouse" ? HIT_RADIUS_MOUSE : HIT_RADIUS_TOUCH) * dprNow();

  /** Move one handle, or (for a label grab) the whole mark, by an image-px delta. */
  function dragMark(edit, to) {
    var m = marks[current][edit.hit.markIndex];
    if (!m) return;
    var dx = to[0] - edit.last[0], dy = to[1] - edit.last[1];
    if (edit.hit.ptIndex === "label") {
      m.pts.forEach(function (pt) { pt[0] += dx; pt[1] += dy; });
    } else {
      var pt = m.pts[edit.hit.ptIndex];

      return;
    }
    if (g === "place" && rec.type === "pen") {

      requestDraw();
      return;
    }

      xform.tx += p.x - prev.x;
      xform.ty += p.y - prev.y;

      return;
    }

      if (!gesture) { gesture = pinchState(); return; }
      var pts = Array.from(pointers.values());
      var a = pts[0].last, b = pts[1].last;
      var dist = Math.hypot(b.x - a.x, b.y - a.y) || 1;

      xform.ty = t[1];

  function endPointer(ev) {
    var rec = pointers.get(ev.pointerId);
    pointers.delete(ev.pointerId);

    hover = null;

    penAnchor = null;

    hidePopover();
    if (rec.multi || XV.gestureFor(rec.type, toolMode(), 1, locked) !== "place") { requestDraw(); return; }

    // rubber band); a finger still has to tap, because a finger that slid meant to pan.

    xform.tx = t[0];
    xform.ty = t[1];

  }, { passive: false });

  // ------------------------------------------------------------ export PNG
  /* 4.2: the windowed film at its own resolution with every mark drawn on top, through the
   * same drawing code as the screen — an identity transform is all that changes.
   */
  function exportPng() {

    if (!f) return;

    out.width = f.cols;
    out.height = f.rows;

    pending = heldPending;

    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = name;

  // ------------------------------------------------------- markup palette
  function buildPalette() {

    MARKUP_WIDTHS.forEach(function (width, i) {
      var b = document.createElement("button");
      b.textContent = ["Thin", "Med", "Thick"][i];
      b.setAttribute("aria-pressed", String(width === inkWidth));
      b.onclick = function () {
        inkWidth = width;
        Array.prototype.forEach.call(widths.children, function (other) {

        });
      };
      widths.appendChild(b);
    });
  }
  buildPalette();

  // -------------------------------------------------------------- controls
  el("open").onclick = function () { el("file").click(); };
  el("file").onchange = function (ev) {
    var chosen = ev.target.files;
    if (!chosen || !chosen.length) return;
    requestPersistence();
    showError("");
    statusBox.textContent = "Reading " + chosen.length + " file(s)…";
    storeFiles(chosen).catch(function (e) { showError("Could not save to this device: " + e.message); });
    ingest(chosen).catch(function (e) { showError(String(e && e.message || e)); });

  };
  el("clear").onclick = function () {
    clearTimeout(saveTimer); saveTimer = null; savePending = null;
    films = []; levels = []; marks = []; current = -1;
    cancelMeasurement();
    syncCalibButtons();
    undoStack = []; redoStack = [];
    syncUndoButtons();
    renderViews();
    emptyBox.classList.remove("hide");
    showError("");
    statusBox.textContent = "";
    clearStore();
    draw();
  };
  el("brightness").oninput = onWindowSlider;
  el("contrast").oninput = onWindowSlider;

      el("strengthValue").textContent = INVERT_STRENGTH_DEFAULT + "%";
    }

    requestDraw();

  el("strength").oninput = function () {

    el("strengthValue").textContent = invertStrength + "%";

  el("calibApply").onclick = applyCalibration;
  el("calibCancel").onclick = function () { hideCalibForm(); cancelMeasurement(); requestDraw(); };
  el("clearCalib").onclick = clearCalibration;
  el("undo").onclick = undo;
  el("redo").onclick = redo;
  el("undoPoint").onclick = undoLastPoint;
  el("clearMeasure").onclick = clearMeasurements;

  el("fit").onclick = fitToStage;
  el("lock").onclick = function () {

  el("rotateRight").onclick = function () { rotateBy(Math.PI / 2); };

  // ------------------------------------------------------------- tabs
  // The relief tab lives in a module script (it needs a dynamic import for three.js);
  // it registers itself on window.ReliefTab, so everything here stays optional.
  var activeTab = "2d";

  function showTab(name) {
    activeTab = name;
    el("panel2d").classList.toggle("hide", name !== "2d");
    el("panelRelief").classList.toggle("hide", name !== "relief");

    el("tabRelief").setAttribute("aria-pressed", String(name === "relief"));

  el("tab2d").onclick = function () { showTab("2d"); };
  el("tabRelief").onclick = function () { showTab("relief"); };

  // The bridge the relief module reads: current film, and a nudge when the selection changes.
  window.XVApp = {

    onFilmChange: null,
    // The relief tab logs its failures here too, so a message survives switching tabs.
    status: function (message) { updateStatus(message); },

  // Leaving the page must not lose the edit still sitting in the 500 ms save timer.

  window.addEventListener("resize", function () { resize(); if (window.ReliefTab) window.ReliefTab.resize(); });

      });
    });

    // reload once so the shell on screen matches the shell in the cache.
    var hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener("controllerchange", function () {
      if (hadController) location.reload();

  // home screen, and once installed navigator.standalone is true and it would be noise.
  function showInstallHint() {
    var ua = navigator.userAgent;
    var iOS = /iPad|iPhone|iPod/.test(ua) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1); // iPadOS desktop UA
    var otherBrowser = /CriOS|FxiOS|EdgiOS|OPiOS/.test(ua);
    var standalone = navigator.standalone === true ||
      (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
    var dismissed = false;
    try { dismissed = !!localStorage.getItem("xv-install-dismissed"); } catch (e) { /* private mode */ }
    if (iOS && !otherBrowser && !standalone && !dismissed) el("install").classList.add("show");
  }
  el("installDismiss").onclick = function () {
    el("install").classList.remove("show");
    try { localStorage.setItem("xv-install-dismissed", "1"); } catch (e) { /* private mode */ }
    resize();
  };
  showInstallHint();

  // ------------------------------------------------------------ start-up
  resize();
  loadStoredFiles().then(function (stored) {
    if (!stored || !stored.length) return;
    statusBox.textContent = "Reopening " + stored.length + " saved file(s)…";
    return ingest(stored);
  }).catch(function (e) {
    showError("Saved files could not be reopened: " + String(e && e.message || e));
  });
})();

<script type="module">
/* Relief tab — reduced port of src/xray_viewer/view3d_relief.py.
 *
 * Pipeline, identical to the desktop at detail=0 / rounding=0 (where its unsharp_mask and
 * round_height are both the identity):
 *     crop_to_content -> downsample -> normalize(window_range) -> clip_percentiles -> gaussian_blur
 *
 * ponytail: no dome field, no canal rounding, no unsharp detail, no auto presets, and the
 * texture is the plain normalised image rather than desktop's filled_texture. Upgrade path is
 * porting dome_field / closing_lift / filled_texture out of view3d_relief.py in that order.
 *
 * ponytail: three.js 0.170.0 ships no UMD build on cdnjs (only three.module.min.js), so this is
 * an ES module with a dynamic import rather than a plain <script> tag, and OrbitControls is not
 * on cdnjs for this version either — the ~70-line touch orbit below stands in for it. Upgrade
 * path: a build step, or a version of three whose examples/jsm is mirrored.
 */
const THREE_URL = "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.170.0/three.module.min.js";

const XV = globalThis.XV;
const el = (id) => document.getElementById(id);
const canvas = el("reliefCanvas");
const message = el("reliefMessage");

let THREE = null;
let renderer = null, scene = null, camera = null, mesh = null;
let target = [0, 0, 0], radius = 1, elevation = XV.HOME_ELEVATION_DEG, azimuth = XV.HOME_AZIMUTH_DEG;
let builtFor = null;          // the film a mesh was last built from
let invertOn = false;
let needsRender = false;
let renderStopped = false;    // a lost context or a throw in the loop: stop, do not spam

el("reliefNote").textContent = XV.RELIEF_NOTE;
XV.RESOLUTIONS.forEach((r) => el("reliefResolution").add(new Option(r + "²", String(r))));
el("reliefResolution").value = String(XV.RESOLUTION_DEFAULT);
XV.SMOOTH_PRESETS.forEach(([name, sigma]) => el("reliefSmooth").add(new Option(name, String(sigma))));
el("reliefSmooth").value = String(XV.SMOOTH_DEFAULT);
XV.INVERT_PRESETS.forEach(([name, pct]) => el("reliefInvertStrength").add(new Option(name, String(pct))));
el("reliefInvertStrength").value = String(XV.INVERT_DEFAULT);

function setMessage(text) {
  message.textContent = text || "";
  message.style.display = text ? "flex" : "none";
}

/* Nothing about a black panel tells us why it is black, so every route a failure can take —
 * a thrown error anywhere on the page, a rejected promise, a lost WebGL context, a throw
 * inside the render loop — ends up as words on that panel and in the 2-D status line. */
function describeError(e) {
  if (!e) return "unknown error";
  const text = e.message ? String(e.message) : String(e);
  const lines = String(e.stack || "").split("\n").map((s) => s.trim()).filter(Boolean);
  const frame = lines.find((s) => s.indexOf(text) === -1) || lines[0] || "";
  return frame ? text + "  [" + frame + "]" : text;
}

function reliefFail(what, e) {
  const text = what + ": " + describeError(e);
  setMessage(text);
  if (window.XVApp && window.XVApp.status) window.XVApp.status(text);
}

window.addEventListener("error", (ev) => {
  reliefFail("Error", ev.error || { message: ev.message + " (" + ev.filename + ":" + ev.lineno + ")" });
});
window.addEventListener("unhandledrejection", (ev) => {
  reliefFail("Unhandled rejection", ev.reason);
});
canvas.addEventListener("webglcontextlost", (ev) => {
  ev.preventDefault();
  renderStopped = true;
  reliefFail("WebGL context lost", { message: "the GPU dropped this canvas — reload the page" });
});

// ------------------------------------------------------------------ geometry

/** The desktop's height field and its grey texture, for one film at one preset. */
function reliefFields(film, resolution, sigma) {
  const full = { data: Float32Array.from(film.pixels), rows: film.rows, cols: film.cols };
  const small = XV.downsample(XV.cropToContent(full), resolution);
  const detail = XV.normalize(small, film.windowRange);
  const height = XV.gaussianBlur(XV.clipPercentiles(detail), sigma);
  return { detail, height };
}

/* The same fields, computed off the main thread. The heavy passes are seconds of work on a
 * multi-megapixel film, and on the main thread that is a frozen tab with a black panel.
 * If the worker cannot be made or dies, the main-thread version above still answers. */
let worker = null;
let workerBroken = false;

function ensureWorker() {
  if (worker || workerBroken) return worker;
  try {
    worker = new Worker("relief-worker.js");
  } catch (e) {
    workerBroken = true;
    worker = null;
  }
  return worker;
}

function reliefFieldsAsync(film, resolution, sigma) {
  const w = ensureWorker();
  if (!w) return Promise.resolve(reliefFields(film, resolution, sigma));
  return new Promise((resolve) => {
    const fallback = () => {
      workerBroken = true;
      if (worker) { worker.terminate(); worker = null; }
      resolve(reliefFields(film, resolution, sigma));
    };
    const onMessage = (ev) => {
      done();
      if (!ev.data || !ev.data.ok) { fallback(); return; }
      const { rows, cols, detail, height } = ev.data;
      resolve({
        detail: { data: new Float32Array(detail), rows, cols },
        height: { data: new Float32Array(height), rows, cols },
      });
    };
    const onError = () => { done(); fallback(); };
    const done = () => {
      w.removeEventListener("message", onMessage);
      w.removeEventListener("error", onError);
    };
    w.addEventListener("message", onMessage);
    w.addEventListener("error", onError);
    // A copy of the film's pixels, handed over rather than cloned; the film keeps its own.
    const pixels = Float32Array.from(film.pixels);
    w.postMessage(
      { pixels: pixels.buffer, rows: film.rows, cols: film.cols, resolution, sigma, windowRange: film.windowRange },
      [pixels.buffer]
    );
  });
}

function buildTexture(detail, strength) {
  const lut = XV.invertLut(strength);
  const { rows, cols, data } = detail;
  const rgba = new Uint8Array(rows * cols * 4);
  for (let r = 0; r < rows; r++) {
    // Row 0 of a DataTexture is v=0, which is the bottom of the plane, so the image is
    // written bottom row first to keep the texture the right way up on the mesh.
    const src = (rows - 1 - r) * cols;
    const dst = r * cols * 4;
    for (let c = 0; c < cols; c++) {
      const v = data[src + c];
      const g = lut[Math.max(0, Math.min(255, Math.round(v * 255)))];
      rgba[dst + c * 4] = g;
      rgba[dst + c * 4 + 1] = g;
      rgba[dst + c * 4 + 2] = g;
      rgba[dst + c * 4 + 3] = 255;
    }
  }
  const tex = new THREE.DataTexture(rgba, cols, rows, THREE.RGBAFormat);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;
  tex.needsUpdate = true;
  return tex;
}

function buildMesh(height, texture) {
  const { rows, cols, data } = height;
  // One unit per source pixel, exactly as the desktop's StructuredGrid; PlaneGeometry's
  // vertices run left-to-right from the top row, which is this array's own row order.
  const geometry = new THREE.PlaneGeometry(cols - 1, rows - 1, cols - 1, rows - 1);
  const position = geometry.attributes.position;
  for (let i = 0; i < data.length; i++) position.setZ(i, data[i] * XV.RELIEF_HEIGHT);
  position.needsUpdate = true;
  geometry.computeVertexNormals();
  geometry.computeBoundingBox();
  const material = new THREE.MeshStandardMaterial({ map: texture, roughness: 0.78, metalness: 0.0 });
  return new THREE.Mesh(geometry, material);
}

// -------------------------------------------------------------------- camera

function applyCamera() {
  const p = XV.orbitPoint(target, radius, elevation, azimuth);
  camera.position.set(p[0], p[1], p[2]);
  camera.up.set(0, 0, 1);
  camera.lookAt(target[0], target[1], target[2]);
  needsRender = true;
}

function goHome() {
  if (!mesh) return;
  const box = mesh.geometry.boundingBox;
  target = [(box.min.x + box.max.x) / 2, (box.min.y + box.max.y) / 2, (box.min.z + box.max.z) / 2];
  elevation = XV.HOME_ELEVATION_DEG;
  azimuth = XV.HOME_AZIMUTH_DEG;

  // The desktop points the camera with HOME_DISTANCE_FACTOR, then calls reset_camera(), which
  // keeps that direction but pulls back until the whole mesh fits, and only then zooms in by
  // HOME_ZOOM. The fit is what actually sets the distance, so it is reproduced here rather
  // than using the factor as a distance on its own.
  const span = Math.max(box.max.x - box.min.x, box.max.y - box.min.y) * XV.HOME_DISTANCE_FACTOR;
  const sphere = 0.5 * Math.hypot(box.max.x - box.min.x, box.max.y - box.min.y, box.max.z - box.min.z);
  const vFov = (camera.fov * Math.PI) / 180;
  const hFov = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);
  const fit = sphere / Math.sin(Math.min(vFov, hFov) / 2);
  radius = Math.max(fit, span * 0.001);

  camera.near = Math.max(radius / 1000, 0.01);
  camera.far = radius * 20;
  camera.zoom = XV.HOME_ZOOM;
  camera.updateProjectionMatrix();
  applyCamera();
}

/* Minimal touch orbit: one finger rotates, two fingers pinch to dolly and drag to pan.
 * Stands in for OrbitControls, which cdnjs does not carry for three 0.170.0. */
const pointers = new Map();
let pinchDist = 0;

function pointerList() { return Array.from(pointers.values()); }

canvas.addEventListener("pointerdown", (ev) => {
  try { canvas.setPointerCapture(ev.pointerId); } catch (e) { /* capture is optional */ }
  pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
  if (pointers.size === 2) {
    const [a, b] = pointerList();
    pinchDist = Math.hypot(b.x - a.x, b.y - a.y) || 1;
  }
});

canvas.addEventListener("pointermove", (ev) => {
  const rec = pointers.get(ev.pointerId);
  if (!rec || !mesh) return;
  const dx = ev.clientX - rec.x;
  const dy = ev.clientY - rec.y;
  rec.x = ev.clientX;
  rec.y = ev.clientY;

  if (pointers.size === 1) {
    azimuth -= dx * 0.4;
    elevation = Math.max(-89, Math.min(89, elevation + dy * 0.4));
    applyCamera();
    return;
  }
  if (pointers.size >= 2) {
    const [a, b] = pointerList();
    const dist = Math.hypot(b.x - a.x, b.y - a.y) || 1;
    radius = Math.max(1e-3, radius * (pinchDist / dist));
    pinchDist = dist;
    // Two-finger drag slides the focus point across the screen plane.
    const right = new THREE.Vector3();
    const up = new THREE.Vector3();
    camera.matrixWorld.extractBasis(right, up, new THREE.Vector3());
    const k = (radius * 0.002) / camera.zoom;
    target = [
      target[0] - (right.x * dx + up.x * -dy) * k,
      target[1] - (right.y * dx + up.y * -dy) * k,
      target[2] - (right.z * dx + up.z * -dy) * k,
    ];
    applyCamera();
  }
});

function endPointer(ev) {
  pointers.delete(ev.pointerId);
  if (pointers.size < 2) pinchDist = 0;
}
canvas.addEventListener("pointerup", endPointer);
canvas.addEventListener("pointercancel", endPointer);
canvas.addEventListener("wheel", (ev) => {
  if (!mesh) return;
  ev.preventDefault();
  radius = Math.max(1e-3, radius * Math.exp(ev.deltaY * 0.0015));
  applyCamera();
}, { passive: false });

// ------------------------------------------------------------------ renderer

async function ensureThree() {
  if (THREE) return true;
  setMessage("Loading the 3D library…");
  try {
    // A stalled download used to leave the panel silent; 25 s is longer than any LTE fetch.
    THREE = await Promise.race([
      import(THREE_URL),
      new Promise((_, reject) => setTimeout(() => reject(new Error("timed out after 25 s")), 25000)),
    ]);
  } catch (e) {
    setMessage("The 3D library could not be loaded (" + describeError(e) + "). Connect to the internet once so it can be cached for offline use.");
    return false;
  }
  setMessage("Starting the 3D renderer…");
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x000000);
  camera = new THREE.PerspectiveCamera(30, 1, 0.1, 1000);
  scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  const key = new THREE.DirectionalLight(0xffffff, 2.1);
  key.position.set(-0.6, -0.7, 1.0);
  scene.add(key);
  const fill = new THREE.DirectionalLight(0xffffff, 0.5);
  fill.position.set(0.8, 0.4, 0.6);
  scene.add(fill);
  resize();
  (function loop() {
    requestAnimationFrame(loop);
    if (renderStopped) return;
    if (needsRender && renderer && scene && camera) {
      needsRender = false;
      try {
        renderer.render(scene, camera);
      } catch (e) {
        renderStopped = true;
        reliefFail("Rendering stopped", e);
      }
    }
  })();
  return true;
}

function resize() {
  if (!renderer) return;
  const w = canvas.clientWidth || 1;
  const h = canvas.clientHeight || 1;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  needsRender = true;
}

async function build() {
  const film = window.XVApp && window.XVApp.film();
  if (!film) { setMessage("Open an X-ray first."); return; }
  try {
    if (!(await ensureThree())) return;
  } catch (e) {
    setMessage("The 3D renderer could not start: " + describeError(e));
    return;
  }

  setMessage("Building relief…");
  await new Promise((r) => setTimeout(r, 30));   // let the message paint before the blocking work
  try {
    const resolution = Number(el("reliefResolution").value);
    const sigma = Number(el("reliefSmooth").value);
    const { detail, height } = await reliefFieldsAsync(film, resolution, sigma);
    const texture = buildTexture(detail, invertOn ? Number(el("reliefInvertStrength").value) / 100 : 0);
    if (mesh) {
      scene.remove(mesh);
      mesh.geometry.dispose();
      if (mesh.material.map) mesh.material.map.dispose();
      mesh.material.dispose();
    }
    mesh = buildMesh(height, texture);
    scene.add(mesh);
    builtFor = film;
    resize();
    goHome();
    setMessage("");
  } catch (e) {
    reliefFail("Relief could not be built", e);
  }
}

async function retexture() {
  if (!mesh || !builtFor) return;
  const resolution = Number(el("reliefResolution").value);
  const sigma = Number(el("reliefSmooth").value);
  const { detail } = await reliefFieldsAsync(builtFor, resolution, sigma);
  const next = buildTexture(detail, invertOn ? Number(el("reliefInvertStrength").value) / 100 : 0);
  if (mesh.material.map) mesh.material.map.dispose();
  mesh.material.map = next;
  mesh.material.needsUpdate = true;
  needsRender = true;
}

// Blake's iPad swallowed the click on this button (2026-09-02) while the emulator did not,
// so the touch itself starts the build and says so on the panel; click is only a fallback.
let lastBuildTap = 0;
function tapBuild(ev) {
  if (Date.now() - lastBuildTap < 700) return;   // pointerup and click both arrive for one tap
  lastBuildTap = Date.now();
  setMessage("Build tapped (" + ev.type + ", " + (ev.pointerType || "click") + ")…");
  build();
}
el("reliefBuild").addEventListener("pointerup", tapBuild);
el("reliefBuild").addEventListener("click", tapBuild);
el("reliefHome").onclick = goHome;
el("reliefInvert").onclick = () => {
  invertOn = !invertOn;
  el("reliefInvert").setAttribute("aria-pressed", String(invertOn));
  retexture();
};
el("reliefInvertStrength").onchange = retexture;
el("reliefResolution").onchange = () => { if (builtFor) build(); };
el("reliefSmooth").onchange = () => { if (builtFor) build(); };

window.XVApp = window.XVApp || {};
window.XVApp.onFilmChange = function () {
  // A different film invalidates the mesh; rebuilding is the user's call, it is not cheap.
  if (builtFor && window.XVApp.film() !== builtFor) setMessage("Different X-ray selected — tap Build.");
};

window.ReliefTab = {
  activate: function () {
    ensureThree().then((ok) => {
      if (!ok) return;
      resize();
      if (!mesh) setMessage(window.XVApp.film() ? "Tap Build to make the relief." : "Open an X-ray first.");
    });
  },
  resize: resize,
};
</script>
